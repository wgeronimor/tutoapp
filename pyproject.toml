[project]
name = "tuto-backend"
version = "0.1.34"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "python-multipart",
    "httpx",
    "fsrs",
    "pypdf>=7.1.0",
]
[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.17.5",
]
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.ruff.lint.per-file-ignores]
"backend/tests/conftest.py" = ["E402"]
"scripts/test_server.py" = ["E402"]
